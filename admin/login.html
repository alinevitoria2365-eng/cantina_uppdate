<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="cv-page-body">
    <div class="container cv-card cv-login-card">

        <!-- LOGOTIPO CORONEL VENÂNCIO -->
        <div class="cv-header">
            <img class="cv-shield" src="../logocv.png" alt="Logotipo Coronel Venâncio">
            <span class="cv-logo-title">Coronel Venâncio</span>
            <span class="cv-logo-underline"></span>
        </div>

        <h2 class="cv-page-title">Login Administrador</h2>
        <div class="cv-divider"><span></span><i></i><span></span></div>
        <p class="cv-page-subtitle">Acesso restrito à gestão da cantina</p>

        <div class="form-panel">
            <div class="form-group">
                <label>Login - CPF</label>
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" id="cpf" placeholder="Digite seu CPF" maxlength="11" inputmode="numeric">
                </div>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="senha" placeholder="Digite sua senha">
                </div>
            </div>

            <div class="btn-arrow-container">
                <button class="btn btn-primary btn-arrow" onclick="entrarAdmin()" aria-label="Entrar">➡️</button>
            </div>
        </div>

        <div class="test-creds">
            <strong>Credenciais de teste</strong>
            CPF: 12345678900 | Senha: admin123
        </div>

        <div class="footer-bar cv-back-bar">
            <button type="button" class="btn btn-outline cv-back-btn" onclick="window.location.href='../index.html'">
                <span class="cv-back-icon">
                    <svg viewBox="0 0 24 24" width="22" height="20" fill="none" stroke="#12305c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 H4 M4 12 L10 6 M4 12 L10 18"/></svg>
                </span>
                <span class="cv-back-divider"></span>
                <span class="cv-back-text">Voltar ao Início</span>
            </button>
        </div>

        <div class="cv-footer">
            <div class="cv-footer-line"></div>
            <span class="cv-footer-icon">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1a4fbf" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 2 V9 M3 2 V7 C3 8.5 4 9 5 9 M7 2 V7 C7 8.5 6 9 5 9"/>
                    <path d="M5 9 V22"/>
                    <path d="M17 2 C14.2 2 14 6 14 8.5 C14 10 15 10.5 16.5 10.5 V22"/>
                    <path d="M16.5 10.5 V2"/>
                </svg>
            </span>
            <div class="cv-footer-line"></div>
        </div>
        <p class="cv-footer-text">Qualidade, organização e cuidado em cada refeição.</p>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("senha").addEventListener("keypress", function(e) {
                if (e.key === "Enter") entrarAdmin();
            });
        });

        function entrarAdmin() {
            const cpf = document.getElementById("cpf").value.trim();
            const senha = document.getElementById("senha").value.trim();

            if (!cpf || !senha) {
                alert("Preencha todos os campos!");
                return;
            }

            if (fazerLogin(cpf, senha, "admin")) {
                window.location.href = "menu.html";
            } else {
                alert("CPF ou senha incorretos!");
            }
        }
    </script>
</body>
</html>
